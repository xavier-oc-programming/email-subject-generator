# Model is stored on HuggingFace Hub (xavier-oc-machinelearn/email-subject-generator-t5).
# The deploy job downloads it fresh each run — no LFS, no git-tracked binaries.
# Deploy uses curl to Kudu zipdeploy endpoint — fire-and-forget, avoids
# az webapp deploy polling hang on F1 free tier.
# Do NOT use azure/webapps-deploy action — unreliable on Linux F1.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download model from HuggingFace Hub
        run: |
          pip install huggingface_hub
          python - <<'EOF'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="xavier-oc-machinelearn/email-subject-generator-t5",
              local_dir="models/t5",
          )
          EOF
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Zip and deploy
        run: |
          zip -rq deploy.zip \
            main.py generator.py config.py \
            requirements.txt startup.txt models/t5/ models/t5_config.json templates/
          TOKEN=$(az account get-access-token --query accessToken -o tsv)
          curl -X POST \
            "https://email-subject-gen-xoc.scm.azurewebsites.net/api/zipdeploy" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @deploy.zip \
            --silent --show-error
