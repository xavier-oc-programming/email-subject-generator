# Model files are committed to models/ so tests load without retraining.
# train.py is NOT run in CI — training is done locally via notebook.
# Deploy uses curl to Kudu zipdeploy endpoint — fire-and-forget, avoids
# az webapp deploy polling hang on F1 free tier.
# Do NOT use azure/webapps-deploy action — unreliable on Linux F1.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Zip and deploy
        run: |
          zip -rq deploy.zip \
            main.py generator.py config.py \
            requirements.txt startup.txt models/t5/ models/t5_config.json templates/
          TOKEN=$(az account get-access-token --query accessToken -o tsv)
          curl -X POST \
            "https://email-subject-gen-xoc.scm.azurewebsites.net/api/zipdeploy" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @deploy.zip \
            --silent --show-error
